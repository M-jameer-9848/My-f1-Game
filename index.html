<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Retro F1 Race</title>
<style>
:root{color-scheme:dark;--lime:#b7ff5a;--panel:#101a13;--edge:#486a42}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#203b29 0,#0a100c 65%);color:#eaffdc;font-family:monospace;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:min(100%,430px);text-align:center}
h1{font-size:clamp(22px,7vw,32px);letter-spacing:3px;color:var(--lime);text-shadow:0 0 12px #8aff4b66;margin:4px 0 6px}
.sub{font-size:11px;color:#a8c59f;margin:0 0 14px}
.machine{border:3px solid #63845a;background:#0b120d;padding:10px;border-radius:12px;box-shadow:0 0 0 4px #17271b,0 18px 50px #0009}
.screen{position:relative;width:100%;max-width:320px;margin:auto;background:#07110a;border:2px solid #30472e;image-rendering:pixelated}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;image-rendering:pixelated;touch-action:none}
.hud{display:flex;justify-content:space-between;gap:8px;padding:10px 2px 2px;font-size:12px;color:#c8e9bd}
.hud strong{color:var(--lime)}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}
button{font: bold 15px monospace;color:#eaffdc;background:linear-gradient(#253c28,#142318);border:2px solid #5d8256;border-radius:8px;padding:14px 8px;box-shadow:inset 0 1px #ffffff16;touch-action:manipulation}
button:active{transform:translateY(1px);background:#38583a}
#start{color:#0c160b;background:var(--lime);border-color:#d5ff9e}
.hint{font-size:11px;color:#a5bda0;line-height:1.6;margin:12px 4px 0}
.credit{font-size:10px;color:#6e8c6a;margin-top:12px}
@media(min-width:500px){.machine{padding:14px}.screen{max-width:320px}}
</style>
</head>
<body>
<main class="wrap">
<h1>F1 RACE</h1><p class="sub">RETRO KEYPAD EDITION · ENDLESS ROAD</p>
<div class="machine">
  <div class="screen"><canvas id="game" width="256" height="256" aria-label="Retro car racing game"></canvas></div>
  <div class="hud"><span>SCORE <strong id="score">0000</strong></span><span>BEST <strong id="best">0000</strong></span><span>LIVES <strong id="lives">♥♥♥</strong></span></div>
</div>
<div class="controls">
<button id="left" aria-label="Move left">◀ LEFT</button>
<button id="start">START / RESTART</button>
<button id="right" aria-label="Move right">RIGHT ▶</button>
<button id="fly" style="grid-column:1 / 4">✦ FLY / JUMP (SPACE or 5)</button>
</div>
<p class="hint">Keyboard: ← → or 4 / 6 to steer · Space / 5 to jump<br>Phone: use the buttons above. Avoid the traffic and beat your best score!</p>
<div class="credit">A small original browser tribute to classic keypad racing games.</div>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives');
let state='title',score=0,best=0,lives=3,playerLane=1,traffic=[],ticks=0,roadOffset=0,fly=0,lastSpawn=0,speed=2;
try{best=+(localStorage.getItem('retroF1Best')||0)}catch(e){}
bestEl.textContent=String(best).padStart(4,'0');
const lanes=[91,128,165], colors=['#ff5d54','#ffd34d','#5ce5ff','#d48cff','#f1f3ee','#ff8f3b'];
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(s,x,y,size=10,color='#d8ffd0',align='center'){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function car(x,y,color,player=false){
  // compact pixel-art cars
  rect(x-7,y-10,14,22,'#050805');rect(x-6,y-9,12,19,color);
  rect(x-4,y-6,8,5,player?'#b8f4ff':'#252e2a');
  rect(x-3,y-5,6,3,'#a8d7d9');
  rect(x-8,y-6,2,5,'#121712');rect(x+6,y-6,2,5,'#121712');
  rect(x-8,y+5,2,5,'#121712');rect(x+6,y+5,2,5,'#121712');
  if(player){rect(x-4,y-9,3,2,'#fff6a0');rect(x+1,y-9,3,2,'#fff6a0');rect(x-3,y+5,6,4,'#293d32')}
  else {rect(x-4,y+7,3,2,'#ff4545');rect(x+1,y+7,3,2,'#ff4545')}
}
function drawRoad(){
 rect(0,0,256,256,'#102414');
 for(let y=0;y<256;y+=8){rect(6,y+((roadOffset*1.4)%8),4,3,'#2b542c');rect(246,y+((roadOffset*1.4)%8),4,3,'#2b542c')}
 rect(27,0,202,256,'#252a29');rect(31,0,194,256,'#343a37');
 rect(27,0,4,256,'#e7e1ca');rect(225,0,4,256,'#e7e1ca');
 for(let y=-16+(roadOffset%32);y<256;y+=32){
  rect(33,y,3,15,'#d44d47');rect(220,y,3,15,'#d44d47');
  rect(90,y,2,15,'#b5b8aa');rect(164,y,2,15,'#b5b8aa');
 }
 // tiny roadside grass pixels
 for(let y=0;y<256;y+=19){rect(14,(y+roadOffset)%256,3,3,'#79a83b');rect(239,(y+roadOffset)%256,3,3,'#79a83b')}
}
function reset(){score=0;lives=3;playerLane=1;traffic=[];ticks=0;roadOffset=0;fly=0;lastSpawn=0;speed=2;state='playing';updateHud()}
function updateHud(){scoreEl.textContent=String(score).padStart(4,'0');livesEl.textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(3-Math.max(0,lives))}
function overlay(title,line,line2){rect(39,86,178,83,'#08120deF');rect(39,86,178,2,'#a8ef74');rect(39,167,178,2,'#a8ef74');text(title,128,110,17,'#c5ff80');text(line,128,132,9,'#efffe9');text(line2,128,149,8,'#a8c59f')}
function frame(){
 ticks++;roadOffset+=state==='playing'?speed:0;drawRoad();
 if(state==='playing'){
   score+=1;speed=Math.min(4.8,2+score/1800);
   if(ticks-lastSpawn>Math.max(24,60-score/35)){let lane=Math.floor(Math.random()*3);traffic.push({lane,y:-20,color:colors[Math.floor(Math.random()*colors.length)],v:speed*(.7+Math.random()*.55)});lastSpawn=ticks}
   for(let i=traffic.length-1;i>=0;i--){let c=traffic[i];c.y+=c.v;car(lanes[c.lane],c.y,c.color,false);
     if(c.y>278)traffic.splice(i,1);
     if(fly<=0&&Math.abs(c.y-211)<16&&c.lane===playerLane){traffic.splice(i,1);lives--;updateHud();if(lives<=0)state='over';else{fly=30}}
   }
   if(fly>0)fly--;
   car(lanes[playerLane],fly>0?207-Math.sin((30-fly)/30*Math.PI)*26:211,'#7cff63',true);
   if(fly>0)text('✦',lanes[playerLane],174,14,'#d6ff80');
   if(ticks%5===0)updateHud();
 } else if(state==='title'){car(lanes[1],211,'#7cff63',true);overlay('F1 RACE','DODGE THE TRAFFIC','PRESS START')}
 else if(state==='over'){car(lanes[playerLane],211,'#7cff63',true);overlay('GAME OVER','SCORE: '+score,'PRESS START TO RETRY');if(score>best){best=score;try{localStorage.setItem('retroF1Best',best)}catch(e){}bestEl.textContent=String(best).padStart(4,'0')}}
 requestAnimationFrame(frame)
}
function steer(d){if(state==='title'){reset();return}if(state!=='playing')return;playerLane=Math.max(0,Math.min(2,playerLane+d))}
function jump(){if(state==='playing')fly=30}
document.getElementById('start').addEventListener('click',reset);
document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();steer(-1)});
document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();steer(1)});
document.getElementById('fly').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','Enter'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='4')steer(-1);if(e.key==='ArrowRight'||e.key==='6')steer(1);if(e.key===' '||e.key==='5'||e.key==='ArrowUp')jump();if(e.key==='Enter'||e.key==='0')reset()});
let touchX=null;canvas.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});canvas.addEventListener('touchend',e=>{if(touchX===null)return;let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>18)steer(dx<0?-1:1);touchX=null},{passive:true});
frame();
})();
</script>
</body>
</html>
